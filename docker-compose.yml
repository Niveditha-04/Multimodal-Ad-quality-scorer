# Runs the baseline classifier head (port 8000) and the compressed head,
# structured pruning at 75% (port 8001), from the same image. Both need
# ANTHROPIC_API_KEY for the explanation call: set it in .env or export it
# before running `docker compose up`.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

  api-optimized:
    build: .
    ports:
      - "8001:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLASSIFIER_CHECKPOINT=compression/checkpoints/structured_pruned_75pct.pt
